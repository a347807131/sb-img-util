
logging:
  level:
    fun.gatsby: DEBUG

app:
  task-to-startup: EXTRACT_SOUNDTRACK_FROM_VIDEO
  global-task-config:
    #输入目录
    in-dir-path: "/Volumes/jav/media/jav uncensored"
    #输出目录
    out-dir-path: /Volumes/影视/media/音频提取/javun/
    enforce: false
    max-worker-num: 4

  process-tasks:
    IMAGE_TRANSFORM:
      #输出格式
      format: jpg

    IMAGE_COMPRESS:
      #压缩限制大小
      compress-limit: 500
      format: jp2
    EXTRACT_SOUNDTRACK_FROM_VIDEO:
      format: mp3

    DRAW_BLUR:
      blur-image-path: D:\原始备份\图片处理模板\2 模糊图
    PDF_MERGE:
      #目录文件所在目录
      cata-dir-path: D:\原始备份\图片处理模板\5 目录
      pdf-image-scale: 0.25
    IMAGE_CUT:
      label-file-path: D:\原始备份\图片处理模板\4 标签文件
    DOUBLE_LAYER_PDF_GENERATE:
      #目录文件所在目录
      cata-dir-path: D:\原始备份\图片处理模板\5 目录
      label-dir-path: D:\原始备份\双层pdf相关\label
    LABELED_DATASET_COLLECT:
      rate-of-train: 0.9
    PDF_ADD_CATA:
      #目录文件所在目录
      cata-dir-path: ${app.global-task-config.in-dir-path}